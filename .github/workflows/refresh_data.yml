name: Refresh 4th Down Decisions Data

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  schedule:
    # Auto sync: Tuesday morning & noon (after MNF) and Friday morning & noon (after TNF)
    - cron: '0 8,12 * * 2'
    - cron: '0 8,12 * * 5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline unit tests
        run: |
          python -m pytest pipeline/tests/test_pipeline.py -v

      - name: Execute data pipeline
        run: |
          python pipeline/build_data.py

      - name: Validate generated data invariants
        run: |
          python -m pytest pipeline/tests/test_pipeline.py -v

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-refresh 4th down decisions data"
            git push
          fi
