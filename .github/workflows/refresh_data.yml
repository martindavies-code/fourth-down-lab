name: Refresh 4th Down Decisions Data

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      allow_monotonicity_decrease:
        description: 'Override monotonicity review gate for legitimate upstream corrections (ALLOW_MONOTONICITY_DECREASE=1)'
        required: false
        type: boolean
        default: false
  schedule:
    # All times UTC. Sunday/Monday catch weekend games; Tuesday follows MNF; Friday follows TNF.
    - cron: '0 23 * * 0'
    - cron: '0 8,12 * * 1,2'
    - cron: '0 8,12 * * 5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute data pipeline
        run: |
          python pipeline/build_data.py
        env:
          ALLOW_MONOTONICITY_DECREASE: ${{ inputs.allow_monotonicity_decrease && '1' || '0' }}

      - name: Validate generated data invariants
        run: |
          python -m pytest pipeline/tests/test_pipeline.py -v -s
        env:
          ALLOW_MONOTONICITY_DECREASE: ${{ inputs.allow_monotonicity_decrease && '1' || '0' }}

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-refresh 4th down decisions data"
            git push
          fi

  alert-on-failure:
    needs: refresh
    if: ${{ failure() && needs.refresh.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: refresh-failure-alert
      cancel-in-progress: false
    steps:
      - name: Open or update refresh failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Data refresh failed';
            const marker = '<!-- fourth-down-lab-refresh-failure -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe data refresh failed. The live site may be stale.\n\nLatest failed run: ${runUrl}\nTrigger: ${context.eventName}\n\nCheck the run logs, fix the cause, and run the refresh again. Close this issue after verifying recovery.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
