name: Refresh 4th Down Decisions Data

# This workflow is PREPARED but NOT enabled automatically.
# Cost analysis:
# - Standard GitHub-hosted Linux runners (ubuntu-latest) are completely FREE with unlimited minutes for PUBLIC repositories.
# - For PRIVATE repositories on a GitHub Free account, GitHub provides 2,000 free runner minutes per month.
#   Running this script takes ~30 seconds, consuming ~0.5 minutes per run.
#   Running once daily consumes ~15 minutes/month (well within the 2,000 free monthly minutes).
# - No external paid API keys or billable cloud resources are required.

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

  # To enable scheduled automatic refresh (e.g. Tuesday morning after MNF):
  # schedule:
  #   - cron: '0 8 * * 2'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install polars pandas pyarrow sportsdataverse xgboost pytest

      - name: Run pipeline unit tests
        run: |
          python -m pytest pipeline/tests/test_pipeline.py -v

      - name: Execute data pipeline
        run: |
          python pipeline/build_data.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-refresh: update 4th down decisions data [skip ci]"
            git push
          fi
